name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/generate_placeholders.py --verify
      - run: pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/generate_placeholders.py --verify
      - run: pytest
      - shell: pwsh
        run: $env:PYTHON_BIN = (Get-Command python).Source; .\packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: alzak-windows-x64
          path: dist/Alzak/

  build-macos-arm:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/generate_placeholders.py --verify
      - run: pytest
      - run: PYTHON_BIN="$(command -v python)" ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: alzak-macos-arm64
          path: dist/Alzak.app/

  build-macos-intel:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/generate_placeholders.py --verify
      - run: pytest
      - run: PYTHON_BIN="$(command -v python)" ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: alzak-macos-x86_64
          path: dist/Alzak.app/
