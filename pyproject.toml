[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alzak-platformer-demo"
version = "0.1.0"
description = "Hratelné technologické demo 2D plošinovky Alzák"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6,<7"]

[project.scripts]
alzak = "alzak.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
